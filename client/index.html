<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager – Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-logo">📚</div>
    <h1>Student Task Manager</h1>
    <p class="subtitle">Organize your studies, ace your goals</p>

    <div class="tabs">
      <button onclick="showTab('login')" class="active" id="tab-login">Login</button>
      <button onclick="showTab('register')" id="tab-register">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-form">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="login()">Login →</button>
      <p id="login-msg" class="msg"></p>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-form" style="display:none">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Your full name">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Min 6 characters">
      </div>
      <button class="btn-primary" onclick="register()">Create Account →</button>
      <p id="register-msg" class="msg"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
