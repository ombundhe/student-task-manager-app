<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand">📚 Task Manager</div>
    <div class="nav-user">
      <span id="user-name"></span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="dashboard">

    <!-- STATS ROW -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">Total Tasks</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-pending">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-inprogress">0</div>
        <div class="stat-label">In Progress</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-done">0</div>
        <div class="stat-label">Completed</div>
      </div>
    </div>

    <!-- ADD TASK FORM -->
    <div class="add-task-card">
      <h2>➕ Add New Task</h2>
      <div class="task-form-grid">
        <input type="text"  id="task-title" placeholder="Task title *" class="span-2">
        <input type="text"  id="task-desc"  placeholder="Description (optional)" class="span-2">
        <input type="date"  id="task-due">
        <select id="task-priority">
          <option value="Low">🟢 Low</option>
          <option value="Medium" selected>🟡 Medium</option>
          <option value="High">🔴 High</option>
        </select>
        <select id="task-status">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
        <button class="btn-add" onclick="addTask()">Add Task</button>
      </div>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
      <span>Filter:</span>
      <button class="filter-btn active" onclick="setFilter('All', this)">All</button>
      <button class="filter-btn" onclick="setFilter('Pending', this)">Pending</button>
      <button class="filter-btn" onclick="setFilter('In Progress', this)">In Progress</button>
      <button class="filter-btn" onclick="setFilter('Completed', this)">Completed</button>
    </div>

    <!-- TASK LIST -->
    <div id="task-list"></div>
  </div>

  <!-- EDIT MODAL -->
  <div id="edit-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3>✏️ Edit Task</h3>
      <input type="hidden" id="edit-id">
      <div class="input-group">
        <label>Title</label>
        <input type="text" id="edit-title">
      </div>
      <div class="input-group">
        <label>Description</label>
        <input type="text" id="edit-desc">
      </div>
      <div class="input-group">
        <label>Due Date</label>
        <input type="date" id="edit-due">
      </div>
      <div class="input-group">
        <label>Priority</label>
        <select id="edit-priority">
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
      </div>
      <div class="input-group">
        <label>Status</label>
        <select id="edit-status">
          <option>Pending</option>
          <option>In Progress</option>
          <option>Completed</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
